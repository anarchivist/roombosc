[project]
name = "roombosc"
version = "0.1.0"
description = "Asynchronous OSC command bridge for a Wi-Fi Roomba 960"
readme = "README.md"
authors = [
    { name = "María A. Matienzo", email = "maria@matienzo.org" }
]
requires-python = ">=3.11"
dependencies = [
    "python-osc>=1.9,<2",
    "pyyaml>=6,<7",
    "roombapy>=2.0.2,<3",
]

[project.scripts]
roombosc = "roombosc:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "roombosc.*"
disallow_untyped_defs = true
