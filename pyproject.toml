[project]
name = "roombosc"
version = "0.1.0"
description = "Asynchronous OSC command bridge for a Wi-Fi Roomba 960"
readme = "README.md"
authors = [
    { name = "María A. Matienzo", email = "maria@matienzo.org" }
]
requires-python = ">=3.11"
dependencies = [
    "python-osc>=1.9,<2",
    "pyyaml>=6,<7",
    "roombapy>=2.0.2,<3",
]

[project.scripts]
roombosc = "roombosc:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
